<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Analysis</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>Data Analysis</h1>

    <p>
        Upload your CSV or Excel data file to begin.
    </p>


    <form action="/upload"
          method="POST"
          enctype="multipart/form-data">

        <label for="file">
            Choose a data file:
        </label>

        <br><br>

        <input
            type="file"
            id="file"
            name="file"
            accept=".csv,.xlsx,.xls"
            required
        >

        <br><br>

        <button type="submit">
            Upload Data
        </button>

    </form>

</div>

</body>

</html>
